    <!--
      DIRECTION CONTRACT · seed 64d8da38

      THESIS: One continuous patient file, not a booking feed. Refuses the
      healthcare-SaaS arrangement: no card grid of smiling doctors, no soft
      teal, no hero metric row.

      OWN-WORLD: Warm paper ground (#FAF9F7), warm near-black ink, one deep
      emerald accent carrying every action and active state. Satoshi for text,
      JetBrains Mono reserved for times, dates and counts. Hairline rules and
      negative space group content; cards appear only where elevation is real.

      STORY: A patient finds a doctor and holds a confirmed time. A doctor
      opens tomorrow's list, reads the last consultation in one glance, and
      writes the next one.

      FIRST VIEWPORT: Asymmetric 7/5 split, no centring. Left: the promise in
      tight grotesk over a live specialty directory. Right: a real consultation
      record, dated, showing what the doctor sees. Primary action sits inline
      under the heading.

      FORM: User-pinned over the roll — non-conceptual, high craft. Two
      re-rolls preceded it; grounded list ranked chart, booklet, Basel, index,
      lab, lightbox, atlas.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
