spring:
  profiles:
    active: dev
  data:
    mongodb:
      # No localhost default on purpose: this project must always point at the
      # Atlas cluster. MONGODB_URI is supplied by backend/.env (see .env.example).
      # A missing value now fails startup instead of silently using a local/Docker mongod.
      uri: ${MONGODB_URI}
      auto-index-creation: true

jwt:
  # No default on purpose: JWT_SECRET must come from backend/.env (see .env.example)
  # or the environment. A missing value fails startup instead of silently
  # signing tokens with a key that lives in git history.
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  # Railway injects PORT at runtime; default to 8080 for local development.
  port: ${PORT:8080}

cors:
  # Comma-separated list of allowed browser origins. Defaults cover local Vite
  # (5173) and CRA (3000). On Railway, set CORS_ALLOWED_ORIGINS to the exact
  # frontend origin(s), e.g. http://localhost:5173 while the UI runs locally.
  # Never use "*" here: authentication uses credentials (Authorization header)
  # and browsers reject wildcard origins when credentials are allowed.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
